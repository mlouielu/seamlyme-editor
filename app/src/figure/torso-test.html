<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Torso test</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b; color: #e4e4e7;
      font-family: ui-monospace, monospace; font-size: 12px;
      display: flex; flex-direction: column; gap: 16px; padding: 16px;
    }
    h2 { color: #a1a1aa; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }

    .cases { display: flex; gap: 16px; flex-wrap: wrap; }
    .case  { display: flex; gap: 16px; align-items: flex-start; background: #18181b; border-radius: 8px; padding: 12px; }
    .case h3 { color: #71717a; font-size: 10px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; }

    svg { background: #27272a; border-radius: 6px; cursor: pointer; flex-shrink: 0; }

    /* landmark hit target */
    .lm-hit { cursor: pointer; }
    .lm-hit:hover line { stroke-opacity: 1 !important; }
    .lm-hit.selected line { stroke-opacity: 1 !important; stroke-width: 2 !important; }
    .lm-hit.selected text { font-weight: 800; }

    /* detail panel */
    .detail {
      width: 340px; background: #09090b; border-radius: 6px; padding: 10px;
      border: 1px solid #27272a; min-height: 200px;
    }
    .detail-empty { color: #52525b; padding: 8px 0; }
    .detail-id { font-size: 13px; font-weight: 700; color: #e4e4e7; margin-bottom: 10px; }

    .section-label { color: #71717a; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; margin: 8px 0 4px; }
    .candidate-row { display: flex; align-items: baseline; gap: 6px; padding: 3px 0; border-bottom: 1px solid #18181b; }
    .candidate-row:last-child { border-bottom: none; }
    .tick   { width: 14px; flex-shrink: 0; color: #4ade80; }
    .no-tick { width: 14px; flex-shrink: 0; color: #3f3f46; }
    .src    { flex: 1; color: #a1a1aa; }
    .src.used { color: #e4e4e7; font-weight: 600; }
    .val    { flex-shrink: 0; color: #71717a; }
    .val.used { color: #e4e4e7; }
    .badge  { font-size: 9px; padding: 1px 4px; border-radius: 3px; flex-shrink: 0; }
    .badge.direct   { background: #14532d; color: #4ade80; }
    .badge.arc      { background: #713f12; color: #facc15; }
    .badge.circ     { background: #7c2d12; color: #fb923c; }
    .badge.derived  { background: #3b0764; color: #c084fc; }
    .badge.canonical{ background: #27272a; color: #52525b; }

    .legend { display: flex; gap: 12px; align-items: center; }
    .legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #71717a; }
    .swatch { width: 10px; height: 10px; border-radius: 2px; }

    .toolbar { display: flex; align-items: center; gap: 12px; }
    .upload-btn {
      background: #27272a; border: 1px solid #3f3f46; color: #e4e4e7;
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px;
      font-family: inherit;
    }
    .upload-btn:hover { background: #3f3f46; }
    .upload-label { color: #71717a; font-size: 11px; }
    .drop-zone {
      border: 1px dashed #3f3f46; border-radius: 8px; padding: 12px 20px;
      color: #52525b; font-size: 11px; text-align: center;
      transition: border-color .15s, color .15s;
    }
    .drop-zone.drag-over { border-color: #4ade80; color: #4ade80; }

    .lm-list { display: flex; flex-direction: column; gap: 2px; min-width: 90px; }
    .lm-list-item {
      padding: 4px 8px; border-radius: 4px; cursor: pointer;
      font-size: 10px; color: #71717a; border: 1px solid transparent;
      white-space: nowrap;
    }
    .lm-list-item:hover { background: #27272a; color: #e4e4e7; }
    .lm-list-item.selected { background: #1c1c1e; border-color: #3f3f46; color: #e4e4e7; font-weight: 700; }
  </style>
</head>
<body>
<script type="module">
import { resolveTorsoLandmarks, buildTorsoPath, buildNeckBackLines, buildNecklineCurve, buildBustpointMark } from './torso.ts';
import { resolveLowerBodyLandmarks, buildHipPath, buildLegPaths, buildFootPaths } from './lower-body.ts';
import { resolveLeftArmLandmarks, resolveRightArmLandmarks, buildArmPath } from './arm.ts';
import { resolveHeadLandmarks, buildHeadPath } from './head.ts';
import { traceOutlineFromShoulder } from './factory.ts';
import { parseSmis } from '@seamlyme/core';

const FULL = {
  height: 65,
  height_shoulder_tip: 54,
  height_neck_front: 55.5,
  height_armpit: 49,
  height_bustpoint: 45,
  height_waist_front: 40.5,
  height_waist_side: 40,
  height_neck_back: 57.5,
  height_neck_side: 57,
  head_length: 9,
  head_width: 6,
  head_circ: 22,
  head_crown_to_neck_back: 8,
  head_chin_to_neck_back: 6,
  shoulder_tip_to_shoulder_tip_f: 15,
  neck_width: 5,
  highbust_arc_f: 16.5,
  bust_arc_f: 18,
  lowbust_arc_f: 16,
  rib_arc_f: 15,
  waist_arc_f: 13.5,
  bustpoint_to_bustpoint: 7,
  across_chest_f: 13,
  armfold_to_armfold_f: 12.5,
  shoulder_tip_to_armfold_f: 5.2,
  arm_shoulder_tip_to_armfold_line: 5.0,
  // lower body
  height_highhip: 36,
  height_hip: 31.5,
  height_gluteal_fold: 30,
  height_knee: 17.5,
  height_calf: 11,
  height_ankle_high: 4,
  height_ankle: 2.5,
  highhip_arc_f: 17,
  hip_arc_f: 20,
  leg_thigh_upper_circ: 22,
  leg_thigh_mid_circ: 19.5,
  leg_knee_circ: 15,
  leg_knee_small_circ: 13,
  leg_calf_circ: 14,
  leg_ankle_high_circ: 10,
  leg_ankle_circ: 9,
  foot_width: 3.5,
  foot_length: 9.5,
  foot_circ: 9,
  foot_instep_circ: 13,
  // arm — bent (L01–L04, left arm)
  arm_shoulder_tip_to_wrist_bent: 24,
  arm_shoulder_tip_to_elbow_bent: 14.5,
  arm_elbow_to_wrist_bent: 9.5,
  arm_elbow_circ_bent: 12,
  // arm — straight (L05–L07, right arm)
  arm_shoulder_tip_to_wrist: 22,
  arm_shoulder_tip_to_elbow: 13.5,
  arm_elbow_to_wrist: 8.5,
  arm_armpit_to_elbow: 8.3,
  arm_elbow_to_wrist_inside: 8.0,
  arm_upper_circ: 13,
  arm_above_elbow_circ: 12,
  arm_elbow_circ: 12,
  arm_lower_circ: 10,
  arm_wrist_circ: 6.25,
  // hand
  hand_palm_length: 4.5,
  hand_length: 7,
  hand_palm_width: 3.5,
  hand_palm_circ: 8,
  hand_circ: 9,
};

const ARCS_ONLY = { ...FULL };

const MINIMAL = {
  height: 65,
  height_bustpoint: 45,
  height_waist_side: 40,
  height_hip: 31.5,
  height_knee: 17.5,
  height_ankle: 2.5,
};

let CASES = [
  { label: 'Full measurements', R: FULL },
  { label: 'Arcs only',         R: ARCS_ONLY },
  { label: 'Minimal',           R: MINIMAL },
];

const PAD = 20, BODY_H = 420, AXIS_X = 160;

function clrFor(c) {
  return c === 'direct' ? '#4ade80' : c === 'arc' ? '#facc15' : c === 'circ' ? '#fb923c' : c === 'derived' ? '#c084fc' : '#52525b';
}

function buildSvg(resolved, lowerResolved, armResolved, rightArmResolved, headResolved, totalH) {
  const { outline, interior } = resolved;
  const neckLandmarks = [
    resolved.neckBack,
    resolved.neckline?.side,
    resolved.neckline?.front,
  ].filter(Boolean);
  const allLandmarks = [
    ...neckLandmarks, ...outline, ...interior,
    ...lowerResolved.hip, ...lowerResolved.leg,
    ...(lowerResolved.foot ? [lowerResolved.foot] : []),
    ...armResolved.landmarks, ...headResolved.landmarks
  ];
  const scale = BODY_H / totalH;
  const toY = h => PAD + (totalH - h) * scale;
  // Widen canvas to fit both arms
  const leftArmXs = armResolved.landmarks.map(l => AXIS_X + l.x * scale);
  const rightArmXs = rightArmResolved.landmarks.map(l => AXIS_X + l.x * scale);
  const minArmX = (leftArmXs.length ? Math.min(...leftArmXs) : 0) - 20;
  const maxArmX = (rightArmXs.length ? Math.max(...rightArmXs) : AXIS_X * 2) + 20;
  const leftPad  = Math.max(0, -minArmX);
  const rightPad = Math.max(0, maxArmX - (AXIS_X * 2));
  const svgW = AXIS_X * 2 + 80 + leftPad + rightPad, svgH = BODY_H + PAD * 2;
  const pathOpts     = { axisX: AXIS_X, toY, scale, fill: '#f2c6a0', stroke: '#8a5a44', fillOpacity: 0.18, strokeOpacity: 0.6 };
  const armOpts      = { axisX: AXIS_X, toY, scale, fill: '#f2c6a0', stroke: '#8a5a44', fillOpacity: 0.18, strokeOpacity: 0.6 };
  const rightArmOpts = { axisX: AXIS_X, toY, scale, fill: '#f2c6a0', stroke: '#8a5a44', fillOpacity: 0.18, strokeOpacity: 0.6, flipNormals: true, capSweep: 0 };
  const hipOpts  = { axisX: AXIS_X, toY, scale, fill: '#a0c4f2', stroke: '#3a5a8a', fillOpacity: 0.18, strokeOpacity: 0.6 };
  const legOpts  = { axisX: AXIS_X, toY, scale, fill: '#a0c4f2', stroke: '#3a5a8a', fillOpacity: 0.18, strokeOpacity: 0.6 };

  const headOpts     = { axisX: AXIS_X, toY, scale, fill: '#f2c6a0', stroke: '#8a5a44', fillOpacity: 0.18, strokeOpacity: 0.6 };
  const headSvg      = buildHeadPath(headResolved, headOpts);
  const armSvg      = buildArmPath(armResolved, armOpts);
  const rightArmSvg = buildArmPath(rightArmResolved, rightArmOpts);
  const outlineSvg     = buildTorsoPath(outline, pathOpts);
  const hipOutlineSvg  = buildHipPath(lowerResolved.hip, hipOpts);
  const crotchLm       = lowerResolved.hip.find(l => l.id === 'crotch') ?? null;
  const ankleLm        = lowerResolved.leg.find(l => l.id === 'ankle') ?? null;
  const legOutlineSvg  = buildLegPaths(lowerResolved.leg, lowerResolved.legOffset, crotchLm, legOpts);
  const footSvg        = (ankleLm && lowerResolved.foot)
    ? buildFootPaths(ankleLm, lowerResolved.foot, lowerResolved.legOffset, legOpts)
    : '';

  const neckBackLinesSvg = (resolved.neckline && resolved.neckBack)
    ? buildNeckBackLines(resolved.neckline.side, resolved.neckBack, { ...pathOpts, color: '#71717a' })
    : '';

  const necklineSvg = resolved.neckline
    ? buildNecklineCurve(resolved.neckline, { ...pathOpts, color: '#a1a1aa' })
    : '';

  // neck-back reference guide line
  const neckBackSvg = resolved.neckBack ? (() => {
    const l = resolved.neckBack;
    const y  = toY(l.y).toFixed(1);
    const hw = ((l.halfW ?? 0) * scale).toFixed(1);
    return `<g class="lm-hit" data-id="neck-back">
      <line x1="${AXIS_X - +hw}" y1="${y}" x2="${AXIS_X + +hw}" y2="${y}"
            stroke="#71717a" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 3"/>
      <circle cx="${AXIS_X}" cy="${y}" r="2" fill="#71717a" opacity="0.6"/>
      <text x="${AXIS_X + +hw + 5}" y="${+y + 4}" font-size="9" fill="#71717a">neck-back</text>
    </g>`;
  })() : '';

  const bustpointSvg = interior
    .map(l => buildBustpointMark(l, pathOpts))
    .join('');

  const guideLines = outline.map(l => {
    const y  = toY(l.y).toFixed(1);
    const hw = ((l.halfW ?? 0) * scale).toFixed(1);
    const clr = clrFor(l.widthConfidence);
    return `<g class="lm-hit" data-id="${l.id}">
      <line x1="${AXIS_X - +hw}" y1="${y}" x2="${AXIS_X + +hw}" y2="${y}"
            stroke="${clr}" stroke-width="1.2" stroke-opacity="0.55" stroke-dasharray="3 2"/>
      <circle cx="${AXIS_X}" cy="${y}" r="2.5" fill="${clr}" opacity="0.7"/>
      <text x="${AXIS_X + +hw + 5}" y="${+y + 4}" font-size="9" fill="${clr}">${l.id}</text>
    </g>`;
  }).join('');

  // interior landmark hit targets (bustpoint etc.)
  const interiorGuides = interior.map(l => {
    const y  = toY(l.y).toFixed(1);
    const hw = ((l.halfW ?? 0) * scale).toFixed(1);
    return `<g class="lm-hit" data-id="${l.id}">
      <rect x="${AXIS_X - +hw - 4}" y="${+y - 6}" width="${+hw * 2 + 8}" height="12" fill="transparent"/>
      <text x="${AXIS_X + +hw + 5}" y="${+y + 4}" font-size="9" fill="#fc8d62">${l.id}</text>
    </g>`;
  }).join('');

  // Hip guide lines — symmetric, same as torso
  const hipGuideLines = lowerResolved.hip.map(l => {
    const y  = toY(l.y).toFixed(1);
    const hw = ((l.halfW ?? 0) * scale).toFixed(1);
    const clr = clrFor(l.widthConfidence);
    return `<g class="lm-hit" data-id="${l.id}">
      <line x1="${AXIS_X - +hw}" y1="${y}" x2="${AXIS_X + +hw}" y2="${y}"
            stroke="${clr}" stroke-width="1.2" stroke-opacity="0.55" stroke-dasharray="3 2"/>
      <circle cx="${AXIS_X}" cy="${y}" r="2.5" fill="${clr}" opacity="0.7"/>
      <text x="${AXIS_X + +hw + 5}" y="${+y + 4}" font-size="9" fill="${clr}">${l.id}</text>
    </g>`;
  }).join('');

  // Leg guide lines — two ticks per landmark (one per leg)
  const ox = lowerResolved.legOffset * scale;
  const legGuideLines = lowerResolved.leg.map(l => {
    const y   = toY(l.y).toFixed(1);
    const hw  = ((l.halfW ?? 0) * scale);
    const clr = clrFor(l.widthConfidence);
    // right leg tick
    const rlx = (AXIS_X + ox - hw).toFixed(1);
    const rrx = (AXIS_X + ox + hw).toFixed(1);
    // left leg tick (mirror)
    const llx = (AXIS_X - ox - hw).toFixed(1);
    const lrx = (AXIS_X - ox + hw).toFixed(1);
    return `<g class="lm-hit" data-id="${l.id}">
      <line x1="${llx}" y1="${y}" x2="${lrx}" y2="${y}" stroke="${clr}" stroke-width="1.2" stroke-opacity="0.55" stroke-dasharray="3 2"/>
      <line x1="${rlx}" y1="${y}" x2="${rrx}" y2="${y}" stroke="${clr}" stroke-width="1.2" stroke-opacity="0.55" stroke-dasharray="3 2"/>
      <circle cx="${(AXIS_X + ox).toFixed(1)}" cy="${y}" r="2" fill="${clr}" opacity="0.7"/>
      <circle cx="${(AXIS_X - ox).toFixed(1)}" cy="${y}" r="2" fill="${clr}" opacity="0.7"/>
      <text x="${+rrx + 5}" y="${+y + 4}" font-size="9" fill="${clr}">${l.id}</text>
    </g>`;
  }).join('');

  const footGuide = (lowerResolved.foot) ? (() => {
    const l = lowerResolved.foot;
    const y  = toY(0).toFixed(1);
    const fl = (l.footLength * scale);
    const clr = clrFor(l.widthConfidence);
    const ox = lowerResolved.legOffset * scale;
    return `<g class="lm-hit" data-id="foot">
      <line x1="${AXIS_X + ox}" y1="${y}" x2="${AXIS_X + ox + fl}" y2="${y}" stroke="${clr}" stroke-width="1.5" stroke-opacity="0.8"/>
      <line x1="${AXIS_X - ox}" y1="${y}" x2="${AXIS_X - ox - fl}" y2="${y}" stroke="${clr}" stroke-width="1.5" stroke-opacity="0.8"/>
      <text x="${AXIS_X + ox + fl + 5}" y="${+y - 4}" font-size="9" fill="${clr}">foot</text>
    </g>`;
  })() : '';

  function buildArmGuideLines(lms, prefix, labelAnchor) {
    return lms.map((l, i, arr) => {
      const sx = AXIS_X + l.x * scale;
      const sy = toY(l.y);
      const hw = l.halfW * scale;
      const prev = arr[Math.max(0, i - 1)];
      const next = arr[Math.min(arr.length - 1, i + 1)];
      const tdx = (AXIS_X + next.x * scale) - (AXIS_X + prev.x * scale);
      const tdy = toY(next.y) - toY(prev.y);
      const tlen = Math.sqrt(tdx * tdx + tdy * tdy) || 1;
      const nx = -tdy / tlen;
      const ny =  tdx / tlen;
      const x1 = (l.innerPt ? AXIS_X + l.innerPt[0] * scale : sx - nx * hw).toFixed(1);
      const y1 = (l.innerPt ? toY(l.innerPt[1]) : sy - ny * hw).toFixed(1);
      const x2 = (l.outerPt ? AXIS_X + l.outerPt[0] * scale : sx + nx * hw).toFixed(1);
      const y2 = (l.outerPt ? toY(l.outerPt[1]) : sy + ny * hw).toFixed(1);
      const clr = clrFor(l.widthConfidence);
      const key = `${prefix}${l.id}`;
      // Label on the outer side
      const labelPt = labelAnchor === 'left'
        ? (+x1 <= +x2 ? [+x1, +y1] : [+x2, +y2])
        : (+x1 >= +x2 ? [+x1, +y1] : [+x2, +y2]);
      const lx = (labelPt[0] + (labelAnchor === 'left' ? -3 : 3)).toFixed(1);
      const anchor = labelAnchor === 'left' ? 'end' : 'start';
      const ly = (labelPt[1] + 4).toFixed(1);
      return `<g class="lm-hit" data-id="${key}">
        <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
              stroke="${clr}" stroke-width="1.2" stroke-opacity="0.55" stroke-dasharray="3 2"/>
        <circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="2.5" fill="${clr}" opacity="0.7"/>
        <text x="${lx}" y="${ly}" font-size="9" fill="${clr}" text-anchor="${anchor}">${l.id}</text>
      </g>`;
    }).join('');
  }

  const headGuideLines = headResolved.landmarks.map(l => {
    const y  = toY(l.y).toFixed(1);
    const hw = (l.halfW * scale).toFixed(1);
    const clr = clrFor(l.widthConfidence);
    return `<g class="lm-hit" data-id="${l.id}">
      <line x1="${AXIS_X - +hw}" y1="${y}" x2="${AXIS_X + +hw}" y2="${y}"
            stroke="${clr}" stroke-width="1.2" stroke-opacity="0.55" stroke-dasharray="3 2"/>
      <circle cx="${AXIS_X}" cy="${y}" r="2.5" fill="${clr}" opacity="0.7"/>
      <text x="${AXIS_X + +hw + 5}" y="${+y + 4}" font-size="9" fill="${clr}">${l.id}</text>
    </g>`;
  }).join('');

  const armGuideLines      = buildArmGuideLines(armResolved.landmarks,      'l-', 'left');
  const rightArmGuideLines = buildArmGuideLines(rightArmResolved.landmarks, 'r-', 'right');

  // Debug: visualize both arm control-point chains.
  const PT_COLORS = { ST:'#f97316', A:'#ef4444', B:'#facc15', C:'#4ade80', D:'#22d3ee', E:'#a78bfa', F:'#f472b6', G:'#fb923c', H:'#34d399', I:'#818cf8', J:'#f9a8d4' };
  function buildDebugPts(points, side) {
    return points ? Object.entries(points).map(([name, [px, py]]) => {
      const cx = (AXIS_X + px * scale).toFixed(1);
      const cy = toY(py).toFixed(1);
      const color = PT_COLORS[name] ?? '#e4e4e7';
      return `<circle cx="${cx}" cy="${cy}" r="4" fill="${color}" opacity="0.9"/>
      <text x="${(+cx + 6).toFixed(1)}" y="${(+cy + 4).toFixed(1)}" fill="${color}" font-size="10" font-weight="bold">${side}-${name}</text>`;
    }).join('') : '';
  }
  const debugPtsSvg = buildDebugPts(armResolved.debugPts, 'L') + buildDebugPts(rightArmResolved.debugPts, 'R');

  const floor = `<line x1="0" y1="${PAD + BODY_H}" x2="${svgW}" y2="${PAD + BODY_H}" stroke="#3f3f46" stroke-width="1"/>`;

  return { svgW, svgH, html: `<svg width="${svgW}" height="${svgH}">${floor}${hipOutlineSvg}${legOutlineSvg}${footSvg}${armSvg}${rightArmSvg}${headSvg}${outlineSvg}${neckBackLinesSvg}${necklineSvg}${neckBackSvg}${bustpointSvg}${guideLines}${interiorGuides}${hipGuideLines}${legGuideLines}${footGuide}${armGuideLines}${rightArmGuideLines}${headGuideLines}${debugPtsSvg}</svg>`, allLandmarks, rightArmResolved };
}

function buildDetailPanel(landmark) {
  if (!landmark) return `<div class="detail-empty">Click a landmark to inspect it</div>`;

  function candidateTable(candidates, prefix) {
    if (!candidates.length) return `<div style="color:#52525b;font-size:11px">no candidates</div>`;
    return candidates.map(c => {
      const missing = !!c.missing;
      const used = c.used && !missing;
      const icon = missing ? '✗' : used ? '✓' : '·';
      const iconCls = used ? 'tick' : 'no-tick';
      const badge = prefix === 'w'
        ? missing
          ? `<span class="badge canonical" style="background:#1c1c1e;color:#3f3f46">missing</span>`
          : `<span class="badge ${c.confidence ?? ''}">${c.confidence ?? ''}</span>`
        : '';
      const valStr = missing ? '—' : c.value.toFixed(3);
      return `<div class="candidate-row" style="${missing ? 'opacity:0.45' : ''}">
        <span class="${iconCls}" style="${missing ? 'color:#3f3f46' : ''}">${icon}</span>
        <span class="src ${used ? 'used' : ''}">${c.source}</span>
        ${badge}
        <span class="val ${used ? 'used' : ''}">${valStr}</span>
      </div>`;
    }).join('');
  }

  const extra = (landmark.id === 'foot') ? `
    <div style="margin-top:12px; padding-top:8px; border-top:1px solid #27272a; display:grid; grid-template-columns:1fr 1fr; gap:8px;">
      <div><div class="section-label">Length</div><div style="color:#e4e4e7">${landmark.footLength.toFixed(1)}</div></div>
      <div><div class="section-label">Instep Width</div><div style="color:#e4e4e7">${landmark.instepWidth.toFixed(1)}</div></div>
      <div><div class="section-label">Ball Width</div><div style="color:#e4e4e7">${landmark.ballWidth.toFixed(1)}</div></div>
    </div>
  ` : '';

  return `
    <div class="detail-id">${landmark.id}</div>
    <div class="section-label">Height (Y) candidates</div>
    ${candidateTable(landmark.yCandidates, 'h')}
    <div class="section-label">Width candidates</div>
    ${candidateTable(landmark.wCandidates, 'w')}
    ${extra}
  `;
}

// ── Cases container (populated by renderAll) ──────────────────────────────────
const casesEl = document.createElement('div');
casesEl.className = 'cases';

// ── Legend ────────────────────────────────────────────────────────────────────
const legendEl = document.createElement('div');
legendEl.className = 'legend';
legendEl.innerHTML = [
  ['#14532d','#4ade80','direct measurement'],
  ['#713f12','#facc15','arc projection'],
  ['#7c2d12','#fb923c','circumference ÷ π'],
  ['#3b0764','#c084fc','derived (e.g. length)'],
  ['#27272a','#52525b','canonical fallback'],
].map(([bg,fg,label]) =>
  `<div class="legend-item"><div class="swatch" style="background:${bg};outline:1px solid ${fg}"></div>${label}</div>`
).join('');

// ── Toolbar + drop zone ───────────────────────────────────────────────────────
const toolbarEl = document.createElement('div');
toolbarEl.className = 'toolbar';
toolbarEl.innerHTML = `
  <button class="upload-btn">Upload .smis file</button>
  <input type="file" accept=".smis,.xml,.vit" style="display:none"/>
  <span class="upload-label" id="upload-label">or drop anywhere</span>
  <label style="color:#a1a1aa;font-size:11px;display:flex;align-items:center;gap:6px;margin-left:16px">
    Right arm angle
    <input type="range" id="arm-angle" min="-30" max="90" step="1" value="0" style="width:120px"/>
    <span id="arm-angle-val" style="color:#e4e4e7;min-width:30px">0°</span>
  </label>
`;

const fileInput = toolbarEl.querySelector('input');
const uploadBtn = toolbarEl.querySelector('.upload-btn');
const uploadLabel = toolbarEl.querySelector('#upload-label');

uploadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

const armAngleInput = toolbarEl.querySelector('#arm-angle');
const armAngleVal   = toolbarEl.querySelector('#arm-angle-val');
armAngleInput.addEventListener('input', () => {
  armAngleDeg = +armAngleInput.value;
  armAngleVal.textContent = `${armAngleDeg}°`;
  renderAll();
});

// drag & drop on whole page
document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drag-over'); });
document.addEventListener('dragleave', () => document.body.classList.remove('drag-over'));
document.addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) loadFile(file);
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const doc = parseSmis(e.target.result);
      const R = {};
      for (const [name, m] of Object.entries(doc.measurements)) {
        // Only set R[name] when the measurement is actually resolved.
        // Absent measurements stay undefined so resolvers can distinguish
        // "not measured" from "measured as 0".
        if (m.resolved != null) R[name] = m.resolved;
      }
      CASES = [{ label: file.name, R }];
      uploadLabel.textContent = file.name;
      renderAll();
    } catch (err) {
      uploadLabel.textContent = `Error: ${err.message}`;
    }
  };
  reader.readAsText(file);
}

let armAngleDeg = 0;

function renderAll() {
  casesEl.innerHTML = '';
  for (const { label, R } of CASES) {
    const totalH = R.height > 0 ? R.height : 65;
    const resolved = resolveTorsoLandmarks(R, totalH);
    const lowerResolved = resolveLowerBodyLandmarks(R, totalH);
    const shoulderLm = resolved.outline.find(l => l.id === 'shoulder');
    const shoulderTipX = shoulderLm ? (shoulderLm.halfW ?? 0) : totalH * 0.115;
    const shoulderTipY = shoulderLm?.y ?? totalH * 0.831;
    const L_A = R.shoulder_tip_to_armfold_f > 0 ? R.shoulder_tip_to_armfold_f : totalH * 0.032;
    const armfoldPt = traceOutlineFromShoulder(resolved.outline, shoulderTipX, shoulderTipY, L_A);
    const hipLm = lowerResolved.hip.find(l => l.id === 'hip');
    const leftHipSidePt = hipLm?.y != null && hipLm.halfW != null ? [-hipLm.halfW, hipLm.y] : undefined;
    const armResolved = resolveLeftArmLandmarks(R, -shoulderTipX, shoulderTipY, armfoldPt, totalH, leftHipSidePt);
    const rightArmResolved = resolveRightArmLandmarks(R, shoulderTipX, shoulderTipY, armfoldPt, totalH, armAngleDeg);
    const headResolved = resolveHeadLandmarks(R, totalH);
    const { html: svgHtml, allLandmarks, rightArmResolved: rArm } = buildSvg(resolved, lowerResolved, armResolved, rightArmResolved, headResolved, totalH);

    const caseEl = document.createElement('div');
    caseEl.className = 'case';

    const leftEl = document.createElement('div');
    leftEl.innerHTML = `<h3>${label}</h3>` + svgHtml;

    // Landmark list — outline + interior separated
    const listEl = document.createElement('div');
    listEl.className = 'lm-list';
    const neckItems = [
      resolved.neckBack    ? `<div class="lm-list-item" data-id="neck-back"  style="border-left:2px solid #52525b">neck-back</div>`  : '',
      resolved.neckline    ? `<div class="lm-list-item" data-id="neck-side"  style="border-left:2px solid #a1a1aa">neck-side</div>`  : '',
      resolved.neckline    ? `<div class="lm-list-item" data-id="neck-front" style="border-left:2px solid #a1a1aa">neck-front</div>` : '',
    ].join('');

    listEl.innerHTML =
      headResolved.landmarks.map(l => {
        const clr = clrFor(l.widthConfidence);
        return `<div class="lm-list-item" data-id="${l.id}" style="border-left:2px solid ${clr}">${l.id}</div>`;
      }).join('') +
      `<div style="border-top:1px solid #27272a;margin:4px 0"></div>` +
      neckItems +
      (neckItems ? `<div style="border-top:1px solid #27272a;margin:4px 0"></div>` : '') +
      resolved.outline.filter(l => !l.id.startsWith('neck')).map(l => {
        const clr = clrFor(l.widthConfidence);
        return `<div class="lm-list-item" data-id="${l.id}" style="border-left:2px solid ${clr}">${l.id}</div>`;
      }).join('') +
      (resolved.interior.length ? `<div style="border-top:1px solid #27272a;margin:4px 0"></div>` : '') +
      resolved.interior.map(l =>
        `<div class="lm-list-item" data-id="${l.id}" style="border-left:2px solid #fc8d62">${l.id}</div>`
      ).join('') +
      (lowerResolved.hip.length ? `<div style="border-top:1px solid #27272a;margin:4px 0"></div>` : '') +
      lowerResolved.hip.map(l => {
        const clr = clrFor(l.widthConfidence);
        return `<div class="lm-list-item" data-id="${l.id}" style="border-left:2px solid ${clr}">${l.id}</div>`;
      }).join('') +
      (lowerResolved.leg.length ? `<div style="border-top:1px solid #27272a;margin:4px 0"></div>` : '') +
      lowerResolved.leg.map(l => {
        const clr = clrFor(l.widthConfidence);
        return `<div class="lm-list-item" data-id="${l.id}" style="border-left:2px solid ${clr}">${l.id}</div>`;
      }).join('') +
      (lowerResolved.foot ? `<div class="lm-list-item" data-id="foot" style="border-left:2px solid ${clrFor(lowerResolved.foot.widthConfidence)}">foot</div>` : '') +
      // Left arm
      (armResolved.landmarks.length ? `<div style="border-top:1px solid #27272a;margin:4px 0"></div>` : '') +
      `<div style="color:#52525b;font-size:9px;padding:2px 4px;text-transform:uppercase;letter-spacing:.05em">left arm</div>` +
      armResolved.landmarks.filter(l => l.section === 'arm').map(l => {
        const clr = clrFor(l.widthConfidence);
        return `<div class="lm-list-item" data-id="l-${l.id}" style="border-left:2px solid ${clr}">${l.id}</div>`;
      }).join('') +
      (armResolved.landmarks.some(l => l.section === 'hand') ? `<div style="border-top:1px solid #27272a;margin:4px 0"></div>` : '') +
      armResolved.landmarks.filter(l => l.section === 'hand').map(l => {
        return `<div class="lm-list-item" data-id="l-${l.id}" style="border-left:2px solid #c084fc">${l.id}</div>`;
      }).join('') +
      // Right arm
      (rArm.landmarks.length ? `<div style="border-top:1px solid #27272a;margin:4px 0"></div>` : '') +
      `<div style="color:#52525b;font-size:9px;padding:2px 4px;text-transform:uppercase;letter-spacing:.05em">right arm</div>` +
      rArm.landmarks.filter(l => l.section === 'arm').map(l => {
        const clr = clrFor(l.widthConfidence);
        return `<div class="lm-list-item" data-id="r-${l.id}" style="border-left:2px solid ${clr}">${l.id}</div>`;
      }).join('') +
      (rArm.landmarks.some(l => l.section === 'hand') ? `<div style="border-top:1px solid #27272a;margin:4px 0"></div>` : '') +
      rArm.landmarks.filter(l => l.section === 'hand').map(l => {
        return `<div class="lm-list-item" data-id="r-${l.id}" style="border-left:2px solid #c084fc">${l.id}</div>`;
      }).join('');

    const detailEl = document.createElement('div');
    detailEl.className = 'detail';
    detailEl.innerHTML = buildDetailPanel(null);

    function selectLandmark(id) {
      leftEl.querySelectorAll('.lm-hit.selected').forEach(el => el.classList.remove('selected'));
      leftEl.querySelector(`.lm-hit[data-id="${id}"]`)?.classList.add('selected');
      listEl.querySelectorAll('.lm-list-item.selected').forEach(el => el.classList.remove('selected'));
      listEl.querySelector(`.lm-list-item[data-id="${id}"]`)?.classList.add('selected');
      // Right arm landmarks are keyed as 'r-<id>'
      const lm =
        id.startsWith('r-')
          ? rArm.landmarks.find(l => l.id === id.slice(2))
          : allLandmarks.find(l => l.id === id) ??
            (id.startsWith('l-') ? allLandmarks.find(l => l.id === id.slice(2)) : undefined);
      detailEl.innerHTML = buildDetailPanel(lm);
    }

    leftEl.querySelector('svg').addEventListener('click', e => {
      const hit = e.target.closest('.lm-hit');
      if (!hit) return;
      selectLandmark(hit.dataset.id);
    });

    listEl.addEventListener('click', e => {
      const item = e.target.closest('.lm-list-item');
      if (!item) return;
      selectLandmark(item.dataset.id);
    });

    caseEl.appendChild(leftEl);
    caseEl.appendChild(listEl);
    caseEl.appendChild(detailEl);
    casesEl.appendChild(caseEl);
  }
}

document.body.appendChild(legendEl);
document.body.appendChild(toolbarEl);
document.body.appendChild(casesEl);

renderAll();
</script>
</body>
</html>
